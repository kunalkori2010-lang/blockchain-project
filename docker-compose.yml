services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: cyberpass
      POSTGRES_DB: cyberchain
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://cyber:cyberpass@db:5432/cyberchain
      JWT_SECRET: change-me-in-production
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
